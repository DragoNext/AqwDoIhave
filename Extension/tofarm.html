<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AqwDoIHave Extras</title>
    <style>
        :root {
            --bg: #efdfc2;
            --bg-soft: #5b2c48;
            --panel: #653452;
            --panel-soft: #653452;
            --border: rgba(60, 24, 50, 0.18);
            --text: #f2eadf;
            --muted: #eadcc8;
            --accent: #9b4dca;
            --good: #43c17b;
            --warn: #f0b35a;
            --bad: #de5b6d;
            --item-grid-min: 170px;
            --group-grid-min: 220px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #efdfc2;
            color: #3b2230;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        a {
            color: inherit;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px 12px;
            border-bottom: 1px solid rgba(255, 231, 185, 0.12);
            background: #441832;
        }

        .top-bar-left {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .brand-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #6eb1f0;
            margin-right: 4px;
        }

        .tab-link {
            border: 1px solid transparent;
            border-radius: 2px;
            background: transparent;
            color: #d9c7d3;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px 2px;
            text-decoration: none;
            transition: 120ms ease;
        }

        .tab-link:hover,
        .tab-link.active {
            border-color: transparent;
            background: transparent;
            color: #fff4de;
        }

        .top-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            color: #d9c7d3;
            font-size: 0.9rem;
        }

        .settings-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 231, 185, 0.14);
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.04);
            color: #eadcc8;
            text-decoration: none;
            transition: 120ms ease;
        }

        .settings-link:hover {
            border-color: rgba(255, 231, 185, 0.24);
            background: rgba(255, 255, 255, 0.08);
            color: #fff4de;
        }

        .settings-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid rgba(255, 231, 185, 0.12);
            background: #5b2c48;
        }

        .filter-left,
        .filter-right {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filter-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 231, 185, 0.1);
            color: #e7d9cc;
            font-size: 0.9rem;
        }

        .filter-pill[hidden],
        .inbank-only-filter[hidden],
        .cosmetic-only-filter[hidden] {
            display: none !important;
        }

        .filter-pill input {
            accent-color: var(--accent);
        }

        .filter-pill img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .separator {
            width: 1px;
            height: 24px;
            background: rgba(255, 231, 185, 0.16);
        }

        .location-filter,
        .grid-size-select,
        .search-input {
            border: 1px solid rgba(255, 231, 185, 0.12);
            border-radius: 2px;
            background: rgba(68, 24, 50, 0.26);
            color: #f3ebdf;
            padding: 8px 10px;
        }

        .search-input::placeholder {
            color: #d7c4cf;
        }

        .search-input {
            min-width: 220px;
        }

        .tab-content {
            display: none;
            padding: 20px 24px 40px;
            background: #efdfc2;
        }

        .tab-content.active {
            display: block;
        }

        .type-filter-group {
            position: relative;
        }

        .type-filter-group[hidden] {
            display: none !important;
        }

        .type-filter-dropdown-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 38px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 231, 185, 0.16);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: #f3ebdf;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 120ms ease;
        }

        .type-filter-dropdown-btn:hover,
        .type-filter-dropdown-btn[aria-expanded="true"] {
            border-color: rgba(255, 231, 185, 0.26);
            background: rgba(255, 255, 255, 0.08);
        }

        .type-filter-dropdown-btn strong {
            color: #f6d77a;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .type-filter-dropdown-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            opacity: 0.9;
        }

        .type-filter-dropdown-panel {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            z-index: 20;
            min-width: min(700px, calc(100vw - 48px));
            max-width: min(860px, calc(100vw - 48px));
            padding: 16px;
            border: 1px solid rgba(255, 231, 185, 0.12);
            border-radius: 10px;
            background: #512744;
            box-shadow: 0 18px 38px rgba(10, 2, 9, 0.38);
        }

        .type-filter-dropdown-panel[hidden] {
            display: none !important;
        }

        .type-filter-dropdown-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .type-filter-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
            padding: 0 10px;
            border: 1px solid rgba(255, 231, 185, 0.14);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: #f3ebdf;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: 120ms ease;
        }

        .type-filter-action-btn:hover {
            border-color: rgba(255, 231, 185, 0.26);
            background: rgba(255, 255, 255, 0.08);
        }

        .type-filter-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .type-filter-section + .type-filter-section {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 231, 185, 0.1);
        }

        .type-filter-section-title {
            color: #f6d77a;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .type-filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .type-filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid rgba(255, 231, 185, 0.14);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: #f3ebdf;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 120ms ease;
        }

        .type-filter-chip:hover {
            border-color: rgba(255, 231, 185, 0.26);
            background: rgba(255, 255, 255, 0.08);
        }

        .type-filter-chip input {
            accent-color: #e1b554;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--item-grid-min), 1fr));
            gap: 14px;
        }

        .item-card,
        .group-card,
        .completed-section {
            background: #5a2e49;
            border: 1px solid rgba(255, 231, 185, 0.08);
            border-radius: 3px;
            box-shadow: none;
            color: #f2eadf;
        }

        .item-card {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: 140ms ease;
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 231, 185, 0.22);
        }

        .item-card.is-query-match {
            border-color: #f1d36b;
            outline: 3px solid #f1d36b;
            outline-offset: -3px;
            box-shadow: inset 0 0 0 2px rgba(241, 211, 107, 0.72), 0 0 28px rgba(241, 211, 107, 0.3);
        }

        .item-card.is-query-match .card-body {
            background: linear-gradient(180deg, rgba(113, 58, 56, 0.14), transparent 42%);
        }

        .item-card.is-query-match .card-image-gallery {
            box-shadow: inset 0 0 0 2px rgba(241, 211, 107, 0.78);
        }

        .item-card.is-query-match::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 241, 181, 0.55);
            pointer-events: none;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: transparent;
            padding: 12px;
            transition: opacity 140ms ease;
        }

        .card-image-wrap {
            position: relative;
            padding: 12px 12px 0;
        }

        .card-image-gallery {
            display: block;
            background: #1f1c28;
            overflow: hidden;
        }

        .card-image-wrap .card-img {
            display: block;
            width: 100%;
        }

        .planner-card-image[hidden],
        .planner-card-canvas[hidden] {
            display: none !important;
        }

        .card-tag-stack {
            position: absolute;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .card-state-icon {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 22px;
            height: 22px;
            box-sizing: border-box;
            padding: 2px;
            object-fit: contain;
            background: rgba(24, 14, 24, 0.88);
            border: 1px solid rgba(255, 231, 185, 0.18);
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        }

        .card-action-stack {
            position: absolute;
            left: 18px;
            bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .card-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            box-sizing: border-box;
            padding: 2px;
            border: 1px solid rgba(255, 231, 185, 0.18);
            border-radius: 0;
            background: rgba(24, 14, 24, 0.88);
            color: #f4ecd6;
            cursor: pointer;
            box-shadow: none;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
            transition: 120ms ease;
        }

        .card-action-btn:hover {
            transform: none;
            border-color: rgba(255, 231, 185, 0.28);
            background: rgba(42, 22, 34, 0.92);
            color: #fff7e3;
        }

        .card-action-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .similarity-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border: 1px solid rgba(255, 231, 185, 0.12);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            color: #f3ebdf;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .similarity-chip strong {
            color: #f6d77a;
        }

        .cosmetic-shell {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .cosmetic-shell.is-empty {
            min-height: 420px;
            justify-content: center;
        }

        .cosmetic-shell.is-empty #cosmetic-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .cosmetic-status {
            background: #5a2e49;
            border: 1px solid rgba(255, 231, 185, 0.08);
            border-radius: 3px;
            color: #f2eadf;
            padding: 16px 18px;
            color: #eadcc8;
            line-height: 1.5;
        }

        .cosmetic-status[hidden] {
            display: none !important;
        }

        .cosmetic-empty {
            max-width: 520px;
            margin: 0 auto;
            padding: 30px 32px;
            border: 1px solid rgba(255, 231, 185, 0.18);
            border-radius: 10px;
            color: #eadcc8;
            background: linear-gradient(180deg, rgba(92, 44, 71, 0.92), rgba(70, 31, 55, 0.96));
            box-shadow: 0 18px 40px rgba(17, 6, 15, 0.22);
            text-align: center;
        }

        .cosmetic-empty-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 231, 185, 0.2);
            background: rgba(24, 14, 24, 0.55);
            color: #f6d77a;
        }

        .cosmetic-empty-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .cosmetic-empty-title {
            color: #fff1da;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .cosmetic-empty-copy {
            margin-top: 10px;
            color: #eadcc8;
            line-height: 1.6;
        }

        .card-body-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }

        .planner-chip.type-chip {
            background: rgba(225, 181, 84, 0.14);
            border-color: rgba(225, 181, 84, 0.18);
            color: #ffe9a9;
        }

        .card-tag-icon {
            width: 22px;
            height: 22px;
            box-sizing: border-box;
            padding: 2px;
            object-fit: contain;
            background: rgba(24, 14, 24, 0.88);
            border: 1px solid rgba(255, 231, 185, 0.18);
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        }

        .card-tag-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 20px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 231, 185, 0.18);
            background: rgba(24, 14, 24, 0.88);
            color: #f3ebdf;
            font-size: 0.64rem;
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .card-tag-label.rare {
            border-color: rgba(214, 172, 92, 0.42);
            color: #f2d48a;
        }

        .card-tag-label.pseudo-rare {
            border-color: rgba(210, 171, 223, 0.34);
            color: #ead3f3;
        }

        .card-body {
            padding: 12px;
        }

        .card-name {
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.35;
        }

        .card-badge,
        .planner-chip,
        .source-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 2px;
            padding: 4px 8px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .card-badge {
            margin: 10px 10px 0;
            color: #fff;
            background: rgba(106, 48, 82, 0.9);
        }

        .card-badge.bank {
            background: rgba(122, 89, 45, 0.9);
        }

        .card-badge.owned {
            background: rgba(52, 110, 75, 0.9);
        }

        .card-badge.needed {
            background: rgba(106, 48, 82, 0.9);
        }

        .card-tags,
        .group-meta,
        .planner-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .planner-chip {
            background: rgba(255, 255, 255, 0.08);
            color: #eadcc8;
        }

        .planner-chip.source-chip {
            justify-content: flex-start;
            width: fit-content;
        }

        .merge-ingredient-chip {
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            min-width: 0;
        }

        .merge-ingredient-name {
            color: #f0e3cf;
        }

        .merge-ingredient-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .merge-ingredient-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 2px 6px;
            border-radius: 2px;
            background: rgba(255, 231, 185, 0.1);
            color: #fff4de;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .merge-ingredient-count.owned {
            background: rgba(255, 231, 185, 0.1);
        }

        .merge-ingredient-count.need {
            background: rgba(84, 36, 66, 0.82);
            color: #f5ddd0;
        }

        .merge-ingredient-count.met {
            background: rgba(60, 124, 78, 0.75);
            color: #f5fff7;
        }

        a.planner-chip {
            text-decoration: none;
        }

        a.planner-chip:hover {
            text-decoration: underline;
        }

        .planner-chip img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .card-source-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .group-card {
            padding: 14px;
            margin-bottom: 16px;
        }

        .group-header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .group-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .group-title a {
            color: #fff4de;
            text-decoration: none;
        }

        .group-title a:hover {
            text-decoration: underline;
        }

        .group-progress {
            min-width: 210px;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 12px;
            border-radius: 2px;
            overflow: hidden;
            background: rgba(255, 231, 185, 0.12);
        }

        .progress-bar-fill {
            height: 100%;
            background: #9b4dca;
        }

        .progress-text {
            margin-top: 6px;
            font-size: 0.82rem;
            color: #eadcc8;
            text-align: right;
        }

        .group-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .group-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--group-grid-min), 1fr));
            gap: 12px;
        }

        .owned-toggle {
            background: none;
            border: none;
            color: var(--accent-2);
            cursor: pointer;
            font-weight: 700;
            padding: 0;
        }

        .owned-collapsed {
            display: none;
            margin-top: 10px;
        }

        .owned-collapsed.active {
            display: block;
        }

        .subquest-section {
            border-top: 1px solid rgba(255, 231, 185, 0.12);
            padding-top: 12px;
        }

        .subquest-header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .subquest-desc,
        .req-sub,
        .empty-state {
            color: #eadcc8;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .req-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .completed-section {
            padding: 16px;
            margin-bottom: 16px;
        }

        .completed-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .completed-section-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .completed-mini-pie {
            --pie-color: #b56bd2;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: conic-gradient(var(--pie-color) 0 var(--pie-pct), rgba(255, 231, 185, 0.16) var(--pie-pct) 100%);
        }

        .completed-mini-pie.ac-seasonal {
            --pie-color: #cc6f8f;
        }

        .completed-mini-pie-center {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #5a2e49;
            border: 1px solid rgba(255, 231, 185, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f2eadf;
            font-size: 0.62rem;
            font-weight: 700;
        }

        .completed-section-progress-copy {
            color: #eadcc8;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .completed-summary-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .completed-summary-card {
            background: #5a2e49;
            border: 1px solid rgba(255, 231, 185, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .completed-summary-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f2eadf;
        }

        .completed-summary-main {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .summary-pie {
            --pie-color: #d1a44c;
            width: 74px;
            height: 74px;
            border-radius: 50%;
            flex: 0 0 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: conic-gradient(var(--pie-color) 0 var(--pie-pct), rgba(255, 231, 185, 0.16) var(--pie-pct) 100%);
        }

        .summary-pie.ac {
            --pie-color: #b56bd2;
        }

        .summary-pie.ac-seasonal {
            --pie-color: #cc6f8f;
        }

        .summary-pie-center {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #5a2e49;
            border: 1px solid rgba(255, 231, 185, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f2eadf;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .completed-summary-copy {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: #eadcc8;
        }

        .completed-summary-primary {
            font-size: 0.96rem;
            font-weight: 700;
            color: #f2eadf;
        }

        .completed-summary-secondary,
        .completed-summary-total {
            font-size: 0.84rem;
        }

        .completed-section-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 12px;
        }

        .pagination-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
        }

        .pagination-controls button,
        .modal-wiki-btn,
        .copy-icon {
            border: 1px solid rgba(255, 231, 185, 0.12);
            border-radius: 2px;
            background: #5b2c48;
            color: #f2eadf;
            cursor: pointer;
            padding: 7px 10px;
            text-decoration: none;
        }

        .pagination-controls button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .page-info {
            color: #5b2c48;
            font-size: 0.9rem;
        }

        .empty-state {
            padding: 24px;
            text-align: center;
        }

        .modal-overlay {
            display: none;
            align-items: center;
            justify-content: center;
            inset: 0;
            position: fixed;
            z-index: 30;
            background: rgba(0, 0, 0, 0.7);
            padding: 24px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            width: min(980px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: #5a2e49;
            border: 1px solid rgba(255, 231, 185, 0.12);
            border-radius: 3px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            color: #f2eadf;
        }

        .modal-header,
        .modal-footer {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 231, 185, 0.12);
        }

        .modal-footer {
            border-top: 1px solid rgba(255, 231, 185, 0.12);
            border-bottom: none;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.4rem;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 24px;
            padding: 24px 20px;
        }

        .modal-image-tabs {
            display: inline-flex;
            gap: 2px;
            margin: 0 0 10px;
        }

        .modal-image-tab {
            border: 1px solid rgba(255, 231, 185, 0.14);
            background: rgba(68, 24, 50, 0.28);
            color: #eadcc8;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 10px;
        }

        .modal-image-tab.active {
            background: #8f2021;
            border-color: rgba(255, 231, 185, 0.22);
            color: #fff4de;
        }

        .modal-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #151524;
            border-radius: 2px;
            padding: 16px;
            transition: opacity 140ms ease;
        }

        .planner-card-image[data-image-state="loading"],
        .modal-image[data-image-state="loading"] {
            background-image: linear-gradient(90deg, rgba(255, 231, 185, 0.04) 0%, rgba(255, 231, 185, 0.15) 50%, rgba(255, 231, 185, 0.04) 100%);
            background-size: 200% 100%;
            animation: image-skeleton 1.15s linear infinite;
        }

        .planner-card-image[data-image-state="loaded"],
        .modal-image[data-image-state="loaded"] {
            animation: none;
            background-image: none;
        }

        .planner-card-image[data-image-state="missing"],
        .modal-image[data-image-state="missing"] {
            animation: none;
            background-image: none;
            opacity: 1;
        }

        @keyframes image-skeleton {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .modal-section {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-label {
            display: block;
            color: #eadcc8;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .modal-value {
            line-height: 1.5;
            color: #f2eadf;
        }

        .modal-description-box {
            padding: 10px 12px;
            border: 1px solid rgba(255, 231, 185, 0.08);
            border-radius: 2px;
            background: #2b2431;
        }

        .modal-req-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-req-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 9px 10px;
            border: 1px solid rgba(255, 231, 185, 0.1);
            border-radius: 2px;
            background: rgba(68, 24, 50, 0.22);
            color: #f2eadf;
            text-decoration: none;
        }

        a.modal-req-item:hover {
            border-color: rgba(255, 231, 185, 0.22);
            background: rgba(68, 24, 50, 0.32);
            text-decoration: none;
        }

        .modal-req-main {
            font-weight: 700;
            color: #fff3df;
        }

        .modal-req-meta {
            color: #eadcc8;
            font-size: 0.82rem;
        }

        .modal-req-extra {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .modal-req-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 2px 7px;
            border-radius: 2px;
            font-size: 0.76rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            background: rgba(255, 231, 185, 0.1);
            color: #fff4de;
        }

        .modal-req-pill.need {
            background: rgba(84, 36, 66, 0.82);
            color: #f5ddd0;
        }

        .modal-req-pill.owned.met {
            background: rgba(60, 124, 78, 0.75);
            color: #f5fff7;
        }

        .modal-location-entry {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .modal-location-entry:last-child {
            margin-bottom: 0;
        }

        .modal-value a,
        .req-sub a,
        .modal-footer a {
            color: #f5e8c9;
            text-decoration: underline;
        }

        .modal-value code,
        .join-cmd code {
            color: #fff4de;
        }

        #modal-slug {
            color: #eadcc8;
        }

        .join-cmd {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 0;
            border-radius: 2px;
            background: rgba(68, 24, 50, 0.28);
            padding: 6px 10px;
        }

        .req-sub {
            margin-top: 2px;
        }

        .copy-icon.copied {
            border-color: rgba(67, 193, 123, 0.4);
            color: #9ef0c0;
        }

        .hidden-compat {
            display: none;
        }

        @media (max-width: 860px) {
            .modal-body {
                grid-template-columns: 1fr;
            }

            .top-bar,
            .filter-bar,
            .tab-content {
                padding-left: 16px;
                padding-right: 16px;
            }

        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <span class="brand-label">AqwDoIHave Extras</span>
            <a href="#" class="tab-link active" data-tab="todrop">{To Drop};</a>
            <a href="#" class="tab-link" data-tab="tomerge">{To Merge};</a>
            <a href="#" class="tab-link" data-tab="toquest">{To Quest};</a>
            <a href="#" class="tab-link" data-tab="inbank">{In Bank};</a>
            <a href="#" class="tab-link" data-tab="completed">{Completed};</a>
            <a href="#" class="tab-link" data-tab="cosmetic">{Cosmetic Search};</a>
        </div>
        <div class="top-stats">
            <span id="stats-left">Loaded Account Items: 0</span>
            <span id="stats-right">Visible Results: 0</span>
            <a class="settings-link" href="options.html" title="Open settings" aria-label="Open settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.22-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.51.41 1.05.72 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.22 1.12-.53 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
            </a>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-left">
            <label class="filter-pill">
                <input id="Filter_NormalItem" type="checkbox" checked>
                <img src="http://aqwwiki.wdfiles.com/local--files/image-tags/Sword_Table.png" alt="Normal">
                <span>Normal</span>
            </label>
            <label class="filter-pill">
                <input id="Filter_AcItem" type="checkbox" checked>
                <img src="https://aqwwiki.wdfiles.com/local--files/image-tags/aclarge.png" alt="AC">
                <span>AC</span>
            </label>
            <label class="filter-pill">
                <input id="Filter_LegendItem" type="checkbox" checked>
                <img src="https://aqwwiki.wdfiles.com/local--files/image-tags/legendlarge.png" alt="Legend">
                <span>Legend</span>
            </label>
            <label class="filter-pill">
                <input id="Filter_SeasonalItem" type="checkbox" checked>
                <img src="https://aqwwiki.wdfiles.com/local--files/image-tags/seasonallarge.png" alt="Seasonal">
                <span>Seasonal</span>
            </label>
            <label class="filter-pill inbank-only-filter" hidden>
                <input id="Filter_RareItem" type="checkbox">
                <img src="https://aqwwiki.wdfiles.com/local--files/image-tags/rarelarge.png" alt="Rare">
                <span>Rare</span>
            </label>
            <label class="filter-pill inbank-only-filter" hidden>
                <input id="Filter_PseudoRareItem" type="checkbox">
                <img src="https://aqwwiki.wdfiles.com/local--files/image-tags/pseudolarge.png" alt="Pseudo Rare">
                <span>Pseudo Rare</span>
            </label>
            <span id="context-filter-separator" class="separator"></span>
            <div id="cosmetic-type-group" class="type-filter-group" hidden>
                <button id="cosmetic-type-toggle" class="type-filter-dropdown-btn" type="button" aria-expanded="false" aria-controls="cosmetic-type-panel">
                    <strong>Types</strong>
                    <span id="cosmetic-type-summary">Armor</span>
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.22 5.97a.75.75 0 0 1 1.06 0L8 9.69l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L3.22 7.03a.75.75 0 0 1 0-1.06Z"/></svg>
                </button>
                <div id="cosmetic-type-panel" class="type-filter-dropdown-panel" hidden></div>
            </div>
            <span id="cosmetic-ownership-separator" class="separator" hidden></span>
            <label class="filter-pill cosmetic-only-filter" hidden>
                <input id="Filter_Cosmetic_Unowned" type="checkbox" checked>
                <span>Unowned</span>
            </label>
            <label class="filter-pill cosmetic-only-filter" hidden>
                <input id="Filter_Cosmetic_InInv" type="checkbox" checked>
                <img src="images/in_inventory.png" alt="In Inventory">
                <span>In Inv</span>
            </label>
            <label class="filter-pill cosmetic-only-filter" hidden>
                <input id="Filter_Cosmetic_InBank" type="checkbox" checked>
                <img src="images/in_bank.png" alt="In Bank">
                <span>In Bank</span>
            </label>
            <select id="location-filter" class="location-filter" hidden>
                <option value="all">All</option>
                <option value="Inv">Inventory</option>
                <option value="Bank">Bank</option>
            </select>
        </div>
        <div class="filter-right">
            <select id="grid-size-select" class="grid-size-select">
                <option value="compact">Compact Grid</option>
                <option value="medium" selected>Medium Grid</option>
                <option value="large">Large Grid</option>
            </select>
            <input id="search-input" class="search-input" type="search" placeholder="Search items, shops, quests, NPCs...">
        </div>
    </div>

    <div id="tab-todrop" class="tab-content active">
        <div id="todrop-grid" class="item-grid"></div>
        <div id="todrop-pagination" class="pagination-controls"></div>
    </div>

    <div id="tab-tomerge" class="tab-content">
        <div id="tomerge-wrap"></div>
        <div id="tomerge-pagination" class="pagination-controls"></div>
    </div>

    <div id="tab-toquest" class="tab-content">
        <div id="toquest-wrap"></div>
        <div id="toquest-pagination" class="pagination-controls"></div>
    </div>

    <div id="tab-inbank" class="tab-content">
        <div id="inbank-grid" class="item-grid"></div>
        <div id="inbank-pagination" class="pagination-controls"></div>
    </div>

    <div id="tab-completed" class="tab-content">
        <div id="completed-wrap"></div>
    </div>

    <div id="tab-cosmetic" class="tab-content">
        <div class="cosmetic-shell">
            <div id="cosmetic-status" class="cosmetic-status" hidden></div>
            <div id="cosmetic-grid" class="item-grid"></div>
            <div id="cosmetic-pagination" class="pagination-controls"></div>
        </div>
    </div>

    <div class="hidden-compat">
        <div id="table-content"></div>
        <div id="pagination-controls"></div>
    </div>

    <div id="item-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div id="modal-title" class="group-title">Item</div>
                    <div id="modal-tags" class="planner-chip-row"></div>
                </div>
                <button id="modal-close" class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-left">
                    <div id="modal-image-tabs" class="modal-image-tabs" hidden></div>
                    <img id="modal-image" class="modal-image" alt="Item image">
                </div>
                <div class="modal-right">
                    <div id="modal-description" class="modal-section"></div>
                    <div id="modal-price" class="modal-section"></div>
                    <div id="modal-sellback" class="modal-section"></div>
                    <div id="modal-location" class="modal-section"></div>
                    <div id="modal-requirements" class="modal-section"></div>
                    <div id="modal-flags" class="modal-section"></div>
                </div>
            </div>
            <div class="modal-footer">
                <span id="modal-slug" class="req-sub"></span>
                <a id="modal-wiki-link" class="modal-wiki-btn" href="#" target="_blank" rel="noreferrer">Open Wiki</a>
            </div>
        </div>
    </div>

    <script src="js/ProcessToFarm.js"></script>
    <script src="js/jquery.min.js"></script>
    <script src="js/Hover.js"></script>
</body>
</html>
